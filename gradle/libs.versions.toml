[versions]
agp = "9.3.0"
kotlin = "2.2.10"
coreKtx = "1.15.0"
appcompat = "1.7.0"
material = "1.12.0"
constraintlayout = "2.2.1"
activity-ktx = "1.9.3"
lifecycle-runtime-ktx = "2.8.7"
